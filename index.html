<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CampusPilot</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════
       TOKENS & BASE SETUP
    ════════════════════════════════════════ */
    :root {
      --ink: #fafafa;
      --muted: #a7a6a6;
      --nav: #b6b5b5;
      --strip: #8b8a8a;
      --pill: #ffffff;
      --pill-ink: #050505;
      --bg: #050505;
      
      --u: calc(100vh / 1058);
      --uw: calc(100vw / 1487);
      --h: clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
    }
    @supports (height: 100dvh) {
      :root { --u: calc(100dvh / 1058); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
    
    button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
    }

    /* ════════════════════════════════════════
       STAGE & VIDEO PLATE
    ════════════════════════════════════════ */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .plate {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .plate-video {
      position: absolute;
      left: 50%;
      top: calc(1 * var(--u));
      width: calc(1492 * var(--u));
      height: calc(1054 * var(--u));
      transform: translateX(calc(-50% - calc(0.5 * var(--u))));
      object-fit: cover;
      pointer-events: none;
    }

    .plate::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: 
        /* Bottom fade */
        linear-gradient(to bottom,
          rgba(5,5,5,0) 78.8%, rgba(5,5,5,.23) 79.6%, rgba(5,5,5,.45) 81.4%,
          rgba(5,5,5,.75) 83.3%, rgba(5,5,5,.84) 85.2%, rgba(5,5,5,.888) 88%,
          rgba(5,5,5,.905) 91%, rgba(5,5,5,.96) 95%, #050505 100%),
        /* Side letterbox */
        linear-gradient(to right,
          #050505 calc(50% - calc(746 * var(--u))),
          transparent calc(50% - calc(676 * var(--u))),
          transparent calc(50% + calc(676 * var(--u))),
          #050505 calc(50% + calc(746 * var(--u))));
    }

    /* ════════════════════════════════════════
       HEADER / NAV
    ════════════════════════════════════════ */
    .topbar {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none; /* Let clicks pass through except on links */
    }
    .topbar > * {
      pointer-events: auto;
    }

    .brand {
      position: absolute;
      left: calc(75 * var(--u));
      top: calc(27 * var(--u));
      width: calc(31.5 * var(--u));
      height: calc(48.5 * var(--u));
      display: block;
    }
    
    .brand svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .links {
      position: absolute;
      left: 50%;
      top: calc(51 * var(--u));
      transform: translate(-50%, -50%);
      display: flex;
      font-size: calc(19.0 * var(--u));
      font-weight: 400;
      color: var(--nav);
      white-space: nowrap;
    }
    
    .links a:nth-child(1) { margin-right: calc(24.5 * var(--u)); }
    .links a:nth-child(2) { margin-right: calc(23.5 * var(--u)); }
    .links a:nth-child(3) { margin-right: calc(26.0 * var(--u)); }
    .links a:hover { color: var(--ink); }

    .pill {
      background-color: var(--pill);
      color: var(--pill-ink);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(.22, 1, .36, 1);
    }
    .pill:hover { transform: scale(1.02); }
    .pill:active { transform: scale(0.98); }

    .pill-nav {
      position: absolute;
      right: calc(75.4 * var(--u));
      top: calc(27 * var(--u));
      width: calc(175 * var(--u));
      height: calc(49 * var(--u));
      font-size: calc(20.6 * var(--u));
      font-weight: 500;
    }
    .pill-nav > span {
      transform: translateY(calc(1 * var(--u)));
    }
    
    .burger {
      display: none;
    }

    /* ════════════════════════════════════════
       HERO CONTENT
    ════════════════════════════════════════ */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .hero > * { pointer-events: auto; }

    .headline {
      position: absolute;
      left: calc(75.5 * var(--u));
      top: calc(230.5 * var(--u));
      font-size: calc(71.6 * var(--h));
      line-height: calc(80.5 * var(--h));
      font-weight: 400;
      letter-spacing: calc(0.3 * var(--h));
      color: var(--ink);
      white-space: nowrap;
      margin: 0;
    }
    .headline span { display: block; }

    .sub {
      position: absolute;
      left: calc(75.5 * var(--u));
      top: calc(230.5 * var(--u) + calc(189.0 * var(--h)));
      font-size: calc(20.7 * var(--h));
      line-height: calc(23.5 * var(--h));
      font-weight: 400;
      word-spacing: calc(1.8 * var(--h));
      color: var(--muted);
      white-space: nowrap;
    }
    .sub span { display: block; }

    .actions {
      position: absolute;
      left: calc(74.9 * var(--u));
      top: calc(230.5 * var(--u) + calc(264.5 * var(--h)));
      display: flex;
      align-items: center;
    }

    .pill-cta {
      width: calc(175.6 * var(--h));
      height: calc(50 * var(--h));
      font-size: calc(20.6 * var(--h));
      font-weight: 500;
    }
    .pill-cta > span {
      transform: translateY(calc(1 * var(--h)));
    }

    .ghost {
      position: absolute;
      left: calc(220.6 * var(--h));
      top: calc(15 * var(--h)); /* Offset relative to .actions wrapper top */
      font-size: calc(20.6 * var(--h));
      font-weight: 500;
      letter-spacing: calc(0.12 * var(--h));
      color: #fff;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .ghost:hover { opacity: 0.8; }

    /* ════════════════════════════════════════
       PARTNER LOGOS
    ════════════════════════════════════════ */
    .logos {
      position: absolute;
      width: calc(741 * var(--u));
      left: 50%;
      top: 0; /* Anchor handled on individual elements */
      transform: translateX(calc(-50% + calc(20 * var(--u))));
      color: var(--strip);
      z-index: 5;
      pointer-events: none;
    }
    
    .lg {
      position: absolute;
      display: flex;
    }
    
    .lg svg {
      color: currentColor;
      fill: currentColor;
    }
    
    /* Simulate IpsumMark with a bold geometric font */
    .wordmark {
      position: absolute;
      font-family: 'IpsumMark', 'Manrope', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    
    .dot {
      display: inline-block;
      width: 0.09em;
      height: 0.09em;
      border-radius: 50%;
      background-color: currentColor;
      vertical-align: 0.62em;
      margin-left: 0.06em;
    }

    .lg1 { left: calc(-0.5 * var(--u)); top: calc(994.7 * var(--u)); }
    .lg1 svg { width: calc(30.5 * var(--u)); height: calc(31 * var(--u)); }
    .lg1 .wordmark { left: calc(37 * var(--u)); top: calc(5.6 * var(--u)); font-size: calc(18.1 * var(--u)); }

    .lg2 { left: calc(206.5 * var(--u)); top: calc(995.7 * var(--u)); }
    .lg2 svg { width: calc(24.5 * var(--u)); height: calc(30 * var(--u)); }
    .lg2 .wordmark { left: calc(31 * var(--u)); top: calc(7.3 * var(--u)); font-size: calc(18.5 * var(--u)); }

    .lg3 { left: calc(416.5 * var(--u)); top: calc(996.7 * var(--u)); }
    .lg3 svg { width: calc(28.5 * var(--u)); height: calc(28 * var(--u)); }
    .lg3 .wordmark { left: calc(35 * var(--u)); top: calc(7.3 * var(--u)); font-size: calc(16.15 * var(--u)); }

    .lg4 { left: calc(620.5 * var(--u)); top: calc(998.7 * var(--u)); }
    .lg4 svg { width: calc(28.5 * var(--u)); height: calc(25.5 * var(--u)); }
    .lg4 .wordmark { left: calc(37 * var(--u)); top: calc(8.3 * var(--u)); font-size: calc(15.3 * var(--u)); }

    /* ════════════════════════════════════════
       ANIMATIONS
    ════════════════════════════════════════ */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise {
        from { opacity: 0; transform: translateY(calc(14 * var(--u))); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes riseNav {
        from { opacity: 0; transform: translate(calc(-50% + 0px), calc(-50% + calc(14 * var(--u)))); }
        to { opacity: 1; transform: translate(calc(-50% + 0px), -50%); }
      }
      
      @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .brand { animation: rise 0.8s cubic-bezier(.22, 1, .36, 1) both; }
      .links { animation: riseNav 0.8s cubic-bezier(.22, 1, .36, 1) both; }
      .pill-nav { animation: rise 0.8s cubic-bezier(.22, 1, .36, 1) both; }
      
      .headline { animation: rise 0.9s cubic-bezier(.22, 1, .36, 1) 0.06s both; }
      .sub { animation: rise 0.9s cubic-bezier(.22, 1, .36, 1) 0.14s both; }
      
      .pill-cta { animation: rise 0.9s cubic-bezier(.22, 1, .36, 1) 0.22s both; }
      .ghost { animation: rise 0.9s cubic-bezier(.22, 1, .36, 1) 0.22s both; }
      
      .lg { animation: fade 1.1s ease 0.34s both; }
    }

    /* ════════════════════════════════════════
       MOBILE MENU OVERLAY
    ════════════════════════════════════════ */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(5,5,5,0.8), #050505);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.42s ease, visibility 0.42s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: calc(30 * var(--m, 1px));
    }
    
    .stage.is-open .menu {
      opacity: 1;
      visibility: visible;
    }

    .menu-inner {
      display: flex;
      flex-direction: column;
    }

    .menu-eyebrow {
      font-size: calc(14 * var(--m, 1px));
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: calc(30 * var(--m, 1px));
      opacity: 0;
      transform: translateY(calc(10 * var(--m, 1px)));
      transition: all 0.4s ease;
    }

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: calc(20 * var(--m, 1px));
      margin-bottom: calc(50 * var(--m, 1px));
    }

    .menu-list li {
      opacity: 0;
      transform: translateY(calc(14 * var(--m, 1px)));
      transition: all 0.4s ease;
    }
    
    .menu-list a {
      font-size: max(25px, calc(31 * var(--m, 1px)));
      font-weight: 500;
      color: var(--ink);
      display: flex;
      align-items: center;
    }
    .menu-list a::after {
      content: '';
      display: inline-block;
      width: calc(8 * var(--m, 1px));
      height: calc(8 * var(--m, 1px));
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      margin-left: calc(15 * var(--m, 1px));
    }

    .menu-foot {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: calc(24 * var(--m, 1px));
      opacity: 0;
      transform: translateY(calc(14 * var(--m, 1px)));
      transition: all 0.4s ease;
    }

    .stage.is-open .menu-eyebrow { opacity: 1; transform: translateY(0); transition-delay: 0.06s; }
    .stage.is-open .menu-list li:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.10s; }
    .stage.is-open .menu-list li:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.16s; }
    .stage.is-open .menu-list li:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.22s; }
    .stage.is-open .menu-list li:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 0.28s; }
    .stage.is-open .menu-foot { opacity: 1; transform: translateY(0); transition-delay: 0.34s; }

    /* Reduced Motion Mobile */
    @media (prefers-reduced-motion: reduce) {
      .menu { transition-duration: 0.001s; }
      .menu-eyebrow, .menu-list li, .menu-foot { transition-duration: 0.001s; }
    }

    /* ════════════════════════════════════════
       PORTRAIT & TABLET RESPONSIVE
    ════════════════════════════════════════ */
    @media (max-aspect-ratio: 11/10) {
      :root {
        --m: min(calc(100vw / 430), 1.34px);
        --u: var(--m);
      }
      
      .links, .pill-nav { display: none !important; }
      
      .burger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: calc(4.3 * var(--m));
        position: absolute;
        right: calc(24 * var(--m));
        top: calc(24 * var(--m));
        width: calc(44 * var(--m));
        height: calc(44 * var(--m));
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 30;
        pointer-events: auto;
      }
      
      .burger i {
        display: block;
        width: calc(16 * var(--m));
        height: 1px;
        background-color: var(--ink);
        transition: transform 0.3s ease;
      }
      
      .stage.is-open .burger i:nth-child(1) {
        transform: translateY(calc(2.15 * var(--m))) rotate(45deg);
      }
      .stage.is-open .burger i:nth-child(2) {
        transform: translateY(calc(-2.15 * var(--m))) rotate(-45deg);
      }

      .plate-video {
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: none;
        object-position: 43% center;
      }

      .plate::after {
        background: 
          linear-gradient(to right, rgba(5,5,5,.86) 0%, rgba(5,5,5,.66) 42%, rgba(5,5,5,.20) 78%, rgba(5,5,5,.10) 100%),
          linear-gradient(to bottom, rgba(5,5,5,.72) 0%, rgba(5,5,5,.34) 24%, rgba(5,5,5,.34) 56%, rgba(5,5,5,.80) 82%, rgba(5,5,5,.97) 94%, #050505 100%);
      }

      .brand {
        left: calc(24 * var(--m));
        top: calc(24 * var(--m));
        width: calc(26 * var(--m));
        height: calc(40 * var(--m));
      }

      .headline {
        left: calc(24 * var(--m));
        top: calc(180 * var(--m));
        font-size: calc(44 * var(--m));
        line-height: calc(52 * var(--m));
        white-space: normal;
        padding-right: calc(24 * var(--m));
      }
      .headline span { display: inline; }

      .sub {
        left: calc(24 * var(--m));
        top: calc(300 * var(--m));
        font-size: calc(16 * var(--m));
        line-height: calc(22 * var(--m));
        white-space: normal;
        padding-right: calc(40 * var(--m));
      }
      .sub span { display: inline; }

      .actions {
        left: calc(24 * var(--m));
        top: calc(400 * var(--m));
        flex-direction: column;
        align-items: flex-start;
        gap: calc(20 * var(--m));
      }
      
      .ghost {
        position: static;
      }
      
      .logos {
        width: 100%;
        left: 0;
        top: auto;
        bottom: calc(40 * var(--m));
        transform: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: calc(30 * var(--m));
        padding: 0 calc(24 * var(--m));
      }
      
      .lg { position: static; justify-content: flex-start; align-items: center; }
      .lg .wordmark { position: static; margin-left: calc(6 * var(--m)); }
    }

    /* Tablet Band specifically */
    @media (min-width: 600px) and (max-aspect-ratio: 11/10) {
      :root {
        --m: min(calc(100vw / 860), calc(100vh / 760), 1.25px);
      }
      
      .plate-video { object-position: 44% center; }
      
      .plate::after {
        background: 
          linear-gradient(to right, rgba(5,5,5,.84) 0%, rgba(5,5,5,.60) 42%, rgba(5,5,5,.16) 78%, rgba(5,5,5,.06) 100%),
          linear-gradient(to bottom, rgba(5,5,5,.66) 0%, rgba(5,5,5,.28) 24%, rgba(5,5,5,.30) 56%, rgba(5,5,5,.78) 82%, rgba(5,5,5,.96) 94%, #050505 100%);
      }
      
      .headline span { display: block; }
      .sub span { display: block; }
      
      .logos {
        display: flex;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    
    <div class="plate">
      <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
      </video>
    </div>

    <header class="topbar">
      <a href="/" class="brand" aria-label="Home" style="font-size: calc(26 * var(--u)); font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; color: var(--ink); display: flex; align-items: center;">
        CampusPilot
      </a>
      
      <nav class="links" aria-label="Primary">
        <a href="/">Home</a>
        <a href="#about">About Us</a>
        <a href="#contact">Contact</a>
      </nav>
      
      <a href="#" class="pill pill-nav">
        <span>Get Started</span>
      </a>
      
      <button class="burger" id="burger" aria-label="Toggle Menu" aria-expanded="false">
        <i></i><i></i>
      </button>
    </header>

    <nav class="menu" id="menu" aria-hidden="true">
      <div class="menu-inner">
        <p class="menu-eyebrow">Menu</p>
        <ul class="menu-list">
          <li><a href="/">Home</a></li>
          <li><a href="#about">About Us</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="menu-foot">
          <a href="#" class="pill" style="width: 180px; height: 50px; font-size: 20px; font-weight: 500;">
            <span style="transform: translateY(1px);">Get Started</span>
          </a>
          <a href="#about" class="ghost" style="position: static; margin-top: 8px;">Learn More</a>
        </div>
      </div>
    </nav>

    <main class="hero">
      <h1 class="headline">
        <span>CampusPilot</span> 
        <span>Your Future</span>
      </h1>
      <p class="sub">
        <span>Everything you need to get campus-ready, practice aptitude,</span>
        <span>and discover internships and hackathons in one place.</span>
      </p>
      
      <div class="actions">
        <a href="#" class="pill pill-cta">
          <span>Get Started</span>
        </a>
        <a href="#about" class="ghost">Learn More</a>
      </div>
    </main>

    <!-- Removed partner logos per request -->
    
  </div>

  <script>
    const burger = document.getElementById('burger');
    const stage = document.getElementById('stage');
    const menu = document.getElementById('menu');
    const menuLinks = menu.querySelectorAll('a');

    function toggleMenu() {
      const isOpen = stage.classList.contains('is-open');
      if (isOpen) {
        stage.classList.remove('is-open');
        burger.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
      } else {
        stage.classList.add('is-open');
        burger.setAttribute('aria-expanded', 'true');
        menu.setAttribute('aria-hidden', 'false');
      }
    }

    burger.addEventListener('click', toggleMenu);

    menuLinks.forEach(link => {
      link.addEventListener('click', () => {
        if (stage.classList.contains('is-open')) toggleMenu();
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && stage.classList.contains('is-open')) {
        toggleMenu();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth / window.innerHeight > 1.1 && stage.classList.contains('is-open')) {
        toggleMenu();
      }
    });
  </script>
</body>
</html>
